[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldguide-rag"
version = "0.1.0"
description = "Grounded document Q&A for salt-marsh researchers and intern training"
requires-python = ">=3.11,<3.14"
dependencies = [
  "faiss-cpu>=1.10,<2",
  "langchain-core>=1.0,<2",
  "langchain-google-genai>=4.0,<5",
  "langchain-huggingface>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "langsmith>=0.3.45,<1",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "sentence-transformers>=3.4,<6",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
overview = ["scikit-learn>=1.6,<2"]
local = ["langchain-ollama>=1,<2"]

[project.scripts]
fieldguide = "fieldguide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
